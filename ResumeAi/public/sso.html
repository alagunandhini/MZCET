<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #F8FAFC;
    }
    .card {
      text-align: center;
      padding: 40px;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #E2E8F0;
      border-top-color: #0EA5E9;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #64748B; font-size: 14px; }
    .error { color: #B91C1C; font-weight: 600; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <p id="status">Verifying your login...</p>
    <p class="error" id="errorMsg" style="display:none;"></p>
  </div>

  <script>
    (function () {
      const API_URL = "http://localhost:3007";

      function getQueryParam(name) {
        const params = new URLSearchParams(window.location.search);
        return params.get(name);
      }

      function showError(msg) {
        document.getElementById("status").style.display = "none";
        document.querySelector(".spinner").style.display = "none";
        const el = document.getElementById("errorMsg");
        el.textContent = msg;
        el.style.display = "block";
      }

      const token = getQueryParam("token");

      if (!token) {
        showError("No token found in URL.");
        return;
      }

      fetch(`${API_URL}/api/auth/sso`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token }),
      })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (!data.success) {
            alert(data.message || "Access denied");
            window.location.href = "http://localhost:3011/home.html";
            return;
          }

          var user = data.user;
          localStorage.setItem("token", token);
          localStorage.setItem("user", JSON.stringify(user));
          localStorage.setItem("username", JSON.stringify(user.name));

          window.location.href = "/resume";
        })
        .catch(function () {
          showError("Unable to reach server. Please try again.");
        });
    })();
  </script>
</body>
</html>
